global-styling:
  version: VERSION
  js:
    js/adminlte.js: {}
    js/app.js: {}
  css:
    component:
      css/adminlte.css: { weight: 100 }
      css/app.css: { weight: 101 }
bootstrap:
  js:
    /libraries/popper.js/dist/umd/popper.min.js: { weight: -19 }
    /libraries/bootstrap/dist/js/bootstrap.min.js: { weight: -20 }
  css:
    component:
      /libraries/bootstrap/dist/css/bootstrap.min.css: {}
  dependencies:
    - core/jquery
    - core/popperjs
color.preview:
  version: VERSION
  css:
    theme:
      color/preview.css: {}
  js:
    color/preview.js: {}
  dependencies:
    - color/drupal.color
overlayscrollbars:
  js:
    /libraries/OverlayScrollbars/overlayscrollbars.browser.es6.min.js: { weight: -19 }
  css:
    component:
      /libraries/OverlayScrollbars/overlayscrollbars.min.css: {}
  dependencies:
    - core/jquery
