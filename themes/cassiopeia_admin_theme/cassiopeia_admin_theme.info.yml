name: Cassiopeia admin theme
type: theme
description: 'Cassiopeia admin theme base on top  booststrap theme.'
core_version_requirement: ^10.3 || ^11.0
base theme: bootstrap
dependencies:
  - cassiopeia:cassiopeia
  - cassiopeia_admin:cassiopeia_admin
regions:
  breadcrumbs: Breadcrumbs
  status_messages: 'Status messages'
#  navbar_right: 'Navbar right'
  content: Content
  footer: Footer
#  header: 'Top Bar'
  highlighted: 'Highlighted'
#  help: 'Help'
#  sidebar_first: 'Primary'
#  sidebar_second: 'Secondary'

libraries:
  - cassiopeia_admin_theme/overlayscrollbars
  - cassiopeia_admin_theme/global-styling

# AdminLTE ships layout CSS; load vendor Bootstrap grid/reboot via cassiopeia_admin_theme/bootstrap.
libraries-override:
  bootstrap/global-styling: false
  bootstrap/bootstrap-icons:
    css:
      component:
        /libraries/bootstrap-icons/font/bootstrap-icons.min.css: false
        css/components/bootstrap-icons.css: false

version: '5.0.1'
#project: 'cassiopeia'
datestamp: 1726511779


