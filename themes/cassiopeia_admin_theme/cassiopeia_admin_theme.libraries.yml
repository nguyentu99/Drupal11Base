critical-admin:
  version: VERSION
  css:
    component:
      css/critical-admin.css: { weight: -200 }

bootstrap-icons-subset:
  version: VERSION
  css:
    component:
      css/bootstrap-icons-subset.css: { weight: -15 }

adminlte:
  version: VERSION
  css:
    component:
      css/adminlte.css: { weight: 100 }
  js:
    js/adminlte.js:
      attributes:
        defer: true

admin-app:
  version: VERSION
  css:
    component:
      css/app.css: { weight: 101 }
  js:
    js/app.js:
      attributes:
        defer: true
  dependencies:
    - cassiopeia_admin_theme/adminlte

global-styling:
  version: VERSION
  dependencies:
    - cassiopeia_admin_theme/critical-admin
    - cassiopeia/bootstrap
    - cassiopeia_admin_theme/bootstrap-icons-subset
    - cassiopeia_admin_theme/admin-app

overlayscrollbars:
  js:
    /libraries/OverlayScrollbars/overlayscrollbars.browser.es6.min.js:
      weight: -19
      attributes:
        defer: true
  css:
    component:
      /libraries/OverlayScrollbars/overlayscrollbars.min.css: {}
  dependencies:
    - core/jquery
