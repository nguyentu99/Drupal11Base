name: Cassiopeia theme
type: theme
description: 'Cassiopeia theme base on top  booststrap theme.'
core_version_requirement: ^10.3 || ^11.0
base theme: bootstrap
dependencies:
  - cassiopeia:cassiopeia
regions:
  status_messages: 'Status messages'
libraries:
  - cassiopeia_theme/global-styling

libraries-override:
  bootstrap/global-styling: false
  bootstrap/messages:
    js:
      js/messages.js: false
  core/jquery: cassiopeia_theme/jquery37
  bootstrap/bootstrap-icons:
    css:
      component:
        /libraries/bootstrap-icons/font/bootstrap-icons.min.css: false
        css/components/bootstrap-icons.css: false

version: '5.0.1'
project: 'cassiopeia_theme'
datestamp: 1726511779
interface translation project: cassiopeia_theme
interface translation server pattern: themes/cassiopeia_theme/translations/%language.po


