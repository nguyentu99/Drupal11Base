cassiopeia.news:
  path: '/news'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\NewsController::content'
    _title_callback: '\Drupal\cassiopeia\Controller\NewsController::title'
  requirements:
    _permission: 'access content'

cassiopeia.market_research:
  path: '/nghien-cuu-thi-truong'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\MarketResearchController::content'
    _title_callback: '\Drupal\cassiopeia\Controller\MarketResearchController::title'
  requirements:
    _permission: 'access content'

cassiopeia.gallery:
  path: '/thu-vien-anh'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\GalleryController::content'
    _title_callback: '\Drupal\cassiopeia\Controller\GalleryController::title'
  requirements:
    _permission: 'access content'

cassiopeia.investment_handbook:
  path: '/cam-nang-dau-tu'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\InvestmentHandbookController::content'
    _title_callback: '\Drupal\cassiopeia\Controller\InvestmentHandbookController::title'
  requirements:
    _permission: 'access content'

cassiopeia.contact:
  path: '/lien-he'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\ContactController::content'
    _title_callback: '\Drupal\cassiopeia\Controller\ContactController::title'
  requirements:
    _permission: 'access content'

cassiopeia.config:
  path: '/admin/config/cassiopeia/settings'
  defaults:
    _form: '\Drupal\cassiopeia\Form\CassiopeiaConfigForm'
    _title: 'Cassiopeia settings'
  requirements:
    _permission: 'administer cassiopeia site configuration'
