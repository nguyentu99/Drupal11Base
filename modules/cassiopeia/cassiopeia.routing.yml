cassiopeia.news:
  path: '/news'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\NewsController::content'
    _title_callback: '\Drupal\cassiopeia\Controller\NewsController::title'
  requirements:
    _permission: 'access content'

cassiopeia.market_research:
  path: '/nghien-cuu-thi-truong'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\MarketResearchController::content'
    _title_callback: '\Drupal\cassiopeia\Controller\MarketResearchController::title'
  requirements:
    _permission: 'access content'

cassiopeia.gallery:
  path: '/thu-vien-anh'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\GalleryController::content'
    _title_callback: '\Drupal\cassiopeia\Controller\GalleryController::title'
  requirements:
    _permission: 'access content'

cassiopeia.investment_handbook:
  path: '/cam-nang-dau-tu'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\InvestmentHandbookController::content'
    _title_callback: '\Drupal\cassiopeia\Controller\InvestmentHandbookController::title'
  requirements:
    _permission: 'access content'

cassiopeia.contact:
  path: '/lien-he'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\ContactController::content'
    _title_callback: '\Drupal\cassiopeia\Controller\ContactController::title'
  requirements:
    _permission: 'access content'

cassiopeia.services:
  path: '/dich-vu'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\ServicesController::content'
    _title_callback: '\Drupal\cassiopeia\Controller\ServicesController::title'
  requirements:
    _permission: 'access content'

cassiopeia.config:
  path: '/admin/config/cassiopeia/settings'
  defaults:
    _form: '\Drupal\cassiopeia\Form\CassiopeiaConfigForm'
    _title: 'Cassiopeia settings'
  requirements:
    _permission: 'administer cassiopeia site configuration'

cassiopeia.contact_submissions:
  path: '/admin/cassiopeia/contact-submissions'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\ContactSubmissionAdminController::listing'
    _title: 'Contact submissions'
  requirements:
    _permission: 'administer cassiopeia contact submissions'

cassiopeia.contact_submission_view:
  path: '/admin/cassiopeia/contact-submissions/{id}'
  defaults:
    _controller: '\Drupal\cassiopeia\Controller\ContactSubmissionAdminController::view'
    _title: 'Contact submission'
  requirements:
    _permission: 'administer cassiopeia contact submissions'
    id: '\d+'

cassiopeia.contact_submission_delete:
  path: '/admin/cassiopeia/contact-submissions/{id}/delete'
  defaults:
    _form: '\Drupal\cassiopeia\Form\ContactSubmissionDeleteForm'
    _title: 'Delete contact submission'
  requirements:
    _permission: 'administer cassiopeia contact submissions'
    id: '\d+'
