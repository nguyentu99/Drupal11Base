services:
  cassiopeia.dich_vu_content_installer:
    class: Drupal\cassiopeia\Service\DichVuContentInstaller
  cassiopeia.dich_vu_content_importer:
    class: Drupal\cassiopeia\Service\DichVuContentImporter
    arguments: ['@file_system', '@file.repository']
  cassiopeia.homepage_content_provider:
    class: Drupal\cassiopeia\Service\HomepageContentProvider
  cassiopeia.homepage_content_importer:
    class: Drupal\cassiopeia\Service\HomepageContentImporter
    arguments: ['@file_system', '@file.repository']
  cassiopeia.projects_content_importer:
    class: Drupal\cassiopeia\Service\ProjectsContentImporter
    arguments: ['@file_system', '@file.repository']
  cassiopeia.projects_content_installer:
    class: Drupal\cassiopeia\Service\ProjectsContentInstaller
  cassiopeia.home_config_content_installer:
    class: Drupal\cassiopeia\Service\HomeConfigContentInstaller
  cassiopeia.home_config_content_importer:
    class: Drupal\cassiopeia\Service\HomeConfigContentImporter
    arguments: ['@file_system', '@file.repository']
  cassiopeia.config_service_content_installer:
    class: Drupal\cassiopeia\Service\ConfigServiceContentInstaller
  cassiopeia.config_service_content_importer:
    class: Drupal\cassiopeia\Service\ConfigServiceContentImporter
    arguments: ['@file_system', '@file.repository']
  cassiopeia.config_service_content_provider:
    class: Drupal\cassiopeia\Service\ConfigServiceContentProvider
  cassiopeia.main_menu_translation_installer:
    class: Drupal\cassiopeia\Service\MainMenuTranslationInstaller
  cassiopeia.main_menu_legacy_restorer:
    class: Drupal\cassiopeia\Service\MainMenuLegacyRestorer
  cassiopeia.CassiopeiaRenderTemplate:
    class: Drupal\cassiopeia\Service\CassiopeiaRenderTemplate
    arguments: ['@extension.path.resolver']
  cassiopeia.image_builder:
    class: Drupal\cassiopeia\Service\CassiopeiaImageBuilder
    arguments: ['@entity_type.manager']
  cassiopeia.twig_extension:
    class: Drupal\cassiopeia\TwigExtension\CassiopeiaTwigExtension
    arguments: ['@cassiopeia.image_builder', '@renderer']
    tags:
      - { name: twig.extension }
